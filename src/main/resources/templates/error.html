<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SysTrack Pro | Error Encountered</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            color: #333;
        }
        .error-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #ef4444;
        }
        h1 { color: #dc2626; margin-top: 0; }
        p { color: #64748b; line-height: 1.6; }
        .btn-back {
            display: inline-block;
            margin-top: 25px;
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-back:hover { background: #334155; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>An Error Occurred</h1>
        <p>The system monitoring infrastructure encountered an unexpected processing issue or the requested endpoint path could not be completed successfully.</p>
        <a th:href="@{/dashboard}" class="btn-back">Return to Control Panel</a>
    </div>
</body>
</html>
